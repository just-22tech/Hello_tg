name: Build AyuGram Private (5-Stage with Next-Build Cache)

on:
  workflow_dispatch: 

jobs:
  # ==========================================
  # 1st: Clone/Pull & Prepare Part 1
  # ==========================================
  job1_clone_prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo (For Patches)
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry
      
      # NEXT BUILD CACHE 
      - name: Restore Previous Full Cache
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-full-${{ github.run_id }}
          restore-keys: |
            tdesktop-full-
            
      - name: Clone or Pull AyuGram & Apply Mods
        run: |
          if [ -d "tdesktop/.git" ]; then
            echo "Found Cache"
            cd tdesktop
            git pull
            git submodule update --init --recursive
            cd ..
          else
            echo "Not Found Cache"
            git clone --recursive https://github.com/AyuGram/AyuGramDesktop.git tdesktop
          fi
          
          python3 -c '
          # 1. Modify prepare script
          with open("tdesktop/Telegram/build/prepare/linux.sh", "r") as f: d1 = f.read()
          old1 = "poetry run gen_dockerfile | DOCKER_BUILDKIT=1 docker build -t tdesktop:centos_env -"
          new1 = "if [ \"$PREPARE_PART\" == \"1\" ]; then\n  poetry run gen_dockerfile > Dockerfile.gen\nelse\n  cat Dockerfile.gen | DOCKER_BUILDKIT=1 docker build -t tdesktop:centos_env -\nfi"
          with open("tdesktop/Telegram/build/prepare/linux.sh", "w") as f: f.write(d1.replace(old1, new1))

          # 2. Modify build script
          with open("tdesktop/Telegram/build/build.sh", "r") as f: d2 = f.read()
          old2 = "./build/docker/centos_env/run.sh /usr/src/tdesktop/Telegram/build/docker/build.sh"
          new2 = "if [ \"$BUILD_PART\" == \"1\" ]; then\n    echo \"Running Build Part 1...\"\n    ./build/docker/centos_env/run.sh /usr/src/tdesktop/Telegram/build/docker/build.sh --target tgcalls\n  else\n    echo \"Running Build Part 2...\"\n    ./build/docker/centos_env/run.sh /usr/src/tdesktop/Telegram/build/docker/build.sh\n  fi"
          with open("tdesktop/Telegram/build/build.sh", "w") as f: f.write(d2.replace(old2, new2))
          
          print("Done Edits Files")
          '

      - name: Prepare Script (Part 1)
        env:
          PREPARE_PART: "1"
        run: ./tdesktop/Telegram/build/prepare/linux.sh

      - name: Save Job 1 Cache (For Job 2)
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-job1-${{ github.run_id }}

  # ==========================================
  # 2nd: Prepare Part 2 (Safety/Backup)
  # ==========================================
  job2_prepare_safety:
    needs: job1_clone_prepare
    runs-on: ubuntu-latest
    steps:
      - name: Install Poetry
        run: pipx install poetry

      - name: Restore Job 1 Cache
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-job1-${{ github.run_id }}
          
      - name: Prepare Script (Part 2 - Docker Build)
        env:
          PREPARE_PART: "2"
        run: ./tdesktop/Telegram/build/prepare/linux.sh

      - name: Save Job 2 Cache (For Job 3)
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-job2-${{ github.run_id }}

  # ==========================================
  # 3rd: Build Part 1
  # ==========================================
  job3_build_1:
    needs: job2_prepare_safety
    runs-on: ubuntu-latest
    steps:
      - name: Restore Job 2 Cache
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-job2-${{ github.run_id }}
          
      - name: Run Build Part 1
        env:
          BUILD_PART: "1"
        run: |
          cd tdesktop
          docker run --rm -u $(id -u) -v "$PWD:/usr/src/tdesktop" -e BUILD_PART=1 ghcr.io/telegramdesktop/tdesktop/centos_env:latest /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh -D TDESKTOP_API_ID=${{ secrets.MY_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.MY_API_HASH }}
          
      - name: Save Job 3 Cache (For Job 4)
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-job3-${{ github.run_id }}

  # ==========================================
  # 4th: Build Part 2
  # ==========================================
  job4_build_2:
    needs: job3_build_1
    runs-on: ubuntu-latest
    steps:
      - name: Restore Job 3 Cache
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-job3-${{ github.run_id }}
          
      - name: Run Build Part 2
        env:
          BUILD_PART: "2"
        run: |
          cd tdesktop
          docker run --rm -u $(id -u) -v "$PWD:/usr/src/tdesktop" -e BUILD_PART=2 ghcr.io/telegramdesktop/tdesktop/centos_env:latest /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh -D TDESKTOP_API_ID=${{ secrets.MY_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.MY_API_HASH }}
          
      - name: Save FULL Cache (For NEXT Build Run)
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-full-${{ github.run_id }}

  # ==========================================
  # 5th: Upload
  # ==========================================
  job5_upload:
    needs: job4_build_2
    runs-on: ubuntu-latest
    steps:
      - name: Restore FULL Cache (For Upload)
        uses: actions/cache@v4
        with:
          path: tdesktop
          key: tdesktop-full-${{ github.run_id }}
          
      - name: Install & Setup Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" > ~/.config/rclone/rclone.conf
          
      - name: Upload to Google Drive
        run: |
          FILE_PATH=$(find tdesktop/out/Release/deploy -name "*.tar.xz" | head -n 1)
          rclone copy "$FILE_PATH" gdrive:AyuGramBuilds/ -v
          
      - name: Cleanup
        if: always()
        run: rm -rf ~/.config/rclone